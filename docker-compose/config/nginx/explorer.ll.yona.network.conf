server {
    listen 80;
    listen 443 ssl;
    server_name explorer.ll.yona.network;

    ssl_certificate /etc/letsencrypt/live/explorer.ll.yona.network/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/explorer.ll.yona.network/privkey.pem;

    if ($scheme = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
