on:
  push:
    branches: [ docker ]

env:
  PROJECT_NAME: yona-explorer-frontend
  REGISTRY: registry.digitalocean.com/mov3r-container

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      app-image: ${{ steps.build-app.outputs.IMAGE }}
      app-image-tag: ${{ steps.build-app.outputs.IMAGE_TAG }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.REGISTRY_PERSONAL_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        run: doctl registry login --expiry-seconds 1200

      - name: Build/push explorer image
        id: build-app
        run: |
          export IMAGE=$REGISTRY/${GITHUB_REPOSITORY#*/}/app
          export IMAGE_TAG=$(echo $GITHUB_SHA | head -c7)
          docker build \
            --cache-to=type=inline \
            --cache-from type=registry,ref=$IMAGE:latest \
            -t $IMAGE:$IMAGE_TAG \
            -t $IMAGE:latest \
            --target app \
            --push \
            .
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "IMAGE=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create environment variables
        run: |
          cat > ./docker-compose/.env << EOF
          EXPLORER_IMAGE="${{ needs.build.outputs.app-image }}:${{ needs.build.outputs.app-image-tag }}"
          EOF

      - name: Sync docker compose files
        uses: burnett01/rsync-deployments@7.1.0
        with:
          switches: -avz --delete -e 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          path: ./docker-compose
          remote_path: "/opt/${GITHUB_REPOSITORY#*/}"
          remote_host: '${{ vars.DEPLOY_SSH_HOST }}'
          remote_user: '${{ vars.DEPLOY_SSH_USER }}'
          remote_key: '${{ secrets.DEPLOY_SSH_KEY }}'

      - name: Deploy with Docker Compose
        uses: appleboy/ssh-action@v1.2.2
        env:
          COMPOSE_PROJECT_NAME: $PROJECT_NAME
        with:
          host: '${{ vars.DEPLOY_SSH_HOST }}'
          username: '${{ vars.DEPLOY_SSH_USER }}'
          key: '${{ secrets.DEPLOY_SSH_KEY }}'
          envs: REGISTRY,COMPOSE_PROJECT_NAME
          script: |
            set -e
            echo "${{ secrets.REGISTRY_PERSONAL_ACCESS_TOKEN }}" | docker login -u \"${{ vars.REGISTRY_PERSONAL_ACCESS_TOKEN_NAME }}\" --password-stdin $REGISTRY
            cd /opt/$COMPOSE_PROJECT_NAME/docker-compose
            docker compose up -d
            sleep 5
            docker compose logs --tail 20
            docker compose ps -a --format 'table {{.Name}}\t{{.Image}}\t{{.Ports}}\t{{.Status}}\t{{lower .Networks}}'
